<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Refrain Pad">
<meta name="theme-color" content="#121212">
<title>Refrain Pad</title>
<style>
:root{
  --bg:#121212; --panel:#1e1e1e; --panel2:#2a2a2a; --text:#f2f2f2; --muted:#a0a0a0;
  --accent:#1ed760; --danger:#ff5a5a; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding-bottom:110px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(18,18,18,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid #222}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:-.3px}
.iconbtn{background:var(--panel);border:1px solid #333;color:var(--text);width:38px;height:38px;
  border-radius:50%;font-size:18px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}
.tile{position:relative;height:118px;border-radius:var(--radius);padding:14px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;user-select:none;-webkit-user-select:none;
  box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .t{font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .a{font-size:12px;opacity:.85;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .m{position:absolute;top:12px;left:14px;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.tile .m.warn{background:rgba(0,0,0,.35);padding:2px 7px;border-radius:999px;opacity:1}
.tile .edit{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(0,0,0,.25);color:#fff;font-size:15px;cursor:pointer}
.tile .bar{position:absolute;left:0;bottom:0;height:5px;width:0;background:rgba(255,255,255,.9)}
.tile.playing{outline:3px solid #fff;outline-offset:-3px}
.tile.playing .m::before{content:"▶ "}
.tile.missing{filter:grayscale(1) brightness(.6)}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;
  border-radius:50%;border:none;background:var(--accent);color:#000;font-size:32px;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer}
.stopbtn{position:fixed;left:20px;bottom:calc(24px + env(safe-area-inset-bottom));height:52px;padding:0 20px;
  border-radius:999px;border:none;background:#fff;color:#000;font-weight:700;font-size:15px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
.stopbtn.show{display:block}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;line-height:1.6}
.empty b{color:var(--text)}
dialog{border:none;border-radius:20px;background:var(--panel);color:var(--text);width:min(520px,calc(100vw - 24px));
  padding:20px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 14px;font-size:19px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3a;background:var(--panel2);
  color:var(--text);font-size:16px}
input:focus{outline:2px solid var(--accent);border-color:transparent}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent);height:34px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0}
.check{display:flex;align-items:center;gap:10px;color:var(--text);font-size:15px;margin-top:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;
  background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--accent);color:#000}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #4a2a2a}
.btn.block{width:100%;margin-top:10px}
.btn.small{padding:10px 8px;font-size:14px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .spacer{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sw.sel{border-color:#fff}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0}
.scrub{background:#161616;border-radius:14px;padding:12px;margin-top:6px}
.scrub .time{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scrub .time b{color:var(--text);font-size:17px}
.scrub .row{margin-top:8px;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#333;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100vw - 32px);
  opacity:0;pointer-events:none;transition:.25s;z-index:50;text-align:center;line-height:1.4}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <h1>🎵 Refrain Pad</h1>
  <button id="settingsBtn" class="iconbtn" aria-label="Einstellungen">⚙</button>
</header>

<main id="grid"></main>

<button id="stopBtn" class="stopbtn">■ Stopp</button>
<button id="addBtn" class="fab" aria-label="Songs hinzufügen">+</button>
<input type="file" id="filePick" accept="audio/*,.mp3,.m4a,.aac,.wav" multiple hidden>
<input type="file" id="fileReplace" accept="audio/*,.mp3,.m4a,.aac,.wav" hidden>
<div id="toast"></div>

<!-- Song bearbeiten -->
<dialog id="editDlg">
  <h2>Song bearbeiten</h2>
  <div class="scrub">
    <div class="time"><span id="sPos"><b>0:00</b></span><span id="sLen">/ 0:00</span></div>
    <input type="range" id="sBar" min="0" max="100" step="0.1" value="0">
    <div class="row">
      <button class="btn small" id="sBack">−5 s</button>
      <button class="btn small" id="sPlay">▶</button>
      <button class="btn small" id="sFwd">+5 s</button>
    </div>
    <button class="btn primary block" id="sSet">Start = hier setzen</button>
  </div>
  <p class="hint">Song abspielen, an den Anfang vom Refrain spulen und „Start = hier setzen“ tippen.</p>
  <div class="row">
    <div><label>Start (m:ss)</label><input id="fStart" placeholder="1:02" inputmode="decimal"></div>
    <div><label>Dauer (Sek., 0 = bis Ende)</label><input id="fDur" placeholder="30" inputmode="numeric"></div>
  </div>
  <label>Titel</label>
  <input id="fTitle" placeholder="Songname">
  <label>Interpret</label>
  <input id="fArtist" placeholder="Interpret">
  <label>Farbe</label>
  <div class="swatches" id="swatches"></div>
  <button class="btn block" id="replaceBtn">Andere Audiodatei wählen</button>
  <div class="actions">
    <button class="btn danger" id="delBtn">Löschen</button>
    <span class="spacer"></span>
    <button class="btn" id="previewBtn">▶ Refrain testen</button>
    <button class="btn primary" id="saveBtn">Speichern</button>
  </div>
</dialog>

<!-- Einstellungen -->
<dialog id="setDlg">
  <h2>Einstellungen</h2>
  <label>Ein- und Ausblenden (Sekunden, 0 = aus)</label>
  <input id="sFade" inputmode="decimal" placeholder="3">
  <label class="check"><input type="checkbox" id="sNorm"> Lautstärke der Songs angleichen</label>
  <p class="hint">Gleicht leise und laute Aufnahmen aneinander an, damit nicht jeder Song anders laut ist.</p>
  <p class="hint" id="sStore"></p>
  <button class="btn danger block" id="wipeBtn">Alle Songs löschen</button>
  <div class="actions"><span class="spacer"></span><button class="btn" id="setClose">Schließen</button></div>
</dialog>

<script>
(() => {
"use strict";

/* ---------- Kleinkram ---------- */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["#1db954","#e91e63","#ff7043","#ffb300","#7e57c2","#29b6f6","#26a69a","#ef5350","#8d6e63","#5c6bc0"];
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
let toastT;
function toast(msg, ms = 3200){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
}
function parseTime(str){
  str = String(str || "").trim().replace(",", ".");
  if (!str) return 0;
  if (str.includes(":")){ const [m, s] = str.split(":"); return (parseFloat(m) || 0) * 60 + (parseFloat(s) || 0); }
  return parseFloat(str) || 0;
}
function fmtTime(sec){
  sec = Math.max(0, Math.round((sec || 0) * 10) / 10);
  const m = Math.floor(sec / 60), s = Math.round((sec - m * 60) * 10) / 10;
  const ss = Number.isInteger(s) ? String(s).padStart(2, "0") : s.toFixed(1).padStart(4, "0");
  return m + ":" + ss;
}
// "1793990677031_Robbie_Williams_-_Angels_-_320_Kbps.mp3" -> {artist:"Robbie Williams", title:"Angels"}
function nameFromFile(fn){
  let s = fn.replace(/\.[a-z0-9]{2,4}$/i, "")
    .replace(/^[0-9a-f]{8}-/i, "")
    .replace(/^\d{6,}_/, "")
    .replace(/Y2Mate\.is[_ -]*-?[_ ]*/i, "")
    .replace(/_/g, " ");
  s = s.replace(/\b\d{2,3}\s*kbps\b/ig, "")
    .replace(/\b(official|offizielles?|offizielle)\s*(music\s*)?(video|audio|musikvideo|lyric video)\b/ig, "")
    .replace(/\bHD\b|\bHQ\b|\(\s*\)|\[\s*\]/g, "")
    .replace(/(\s-\s*)+$/g, "").replace(/\s+-\s*$/g, "").trim();
  let parts = s.split(/\s+-\s+|\s{3,}/).map(x => x.replace(/\s+/g, " ").trim()).filter(Boolean);
  if (parts.length >= 2) return {artist: parts[0], title: parts.slice(1).join(" – ")};
  return {artist: "", title: s.replace(/\s+/g, " ").trim()};
}

/* ---------- Daten ---------- */
const S = {
  songs: LS.get("rp2_songs", []),
  fade: LS.get("rp2_fade", 3),
  norm: LS.get("rp2_norm", true),
};
const saveSongs = () => LS.set("rp2_songs", S.songs);

/* IndexedDB für die Audiodateien – bleiben nur auf diesem Gerät */
let dbP = null;
function db(){
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open("refrainpad", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idb(mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction("files", mode), st = tx.objectStore("files");
    const r = fn(st);
    tx.oncomplete = () => res(r && r.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
const putFile = (id, blob) => idb("readwrite", st => st.put(blob, id));
const getFile = id => idb("readonly", st => st.get(id));
const delFile = id => idb("readwrite", st => st.delete(id));
const allKeys = () => idb("readonly", st => st.getAllKeys());

/* ---------- Audio-Engine ---------- */
// Pro Song ein <audio>-Element -> eigener Gain (Fade) -> Normalisierung -> Limiter -> Lautsprecher.
// Läuft komplett lokal: sofortiger Start, Ton geht über das, was am Handy verbunden ist (Kopfhörer/Bluetooth).
let ctx = null, limiter = null;
const voices = new Map();   // songId -> {el, url, src, fade, norm}
let present = new Set();    // IDs, für die eine Datei gespeichert ist

function ensureCtx(){
  if (!ctx){
    try{ if (navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}  // iPhone: auch bei Lautlos-Schalter hörbar
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -2; limiter.knee.value = 0; limiter.ratio.value = 20;
    limiter.attack.value = 0.003; limiter.release.value = 0.25;
    limiter.connect(ctx.destination);
  }
  if (ctx.state !== "running") ctx.resume().catch(() => {});
  return ctx;
}
async function getVoice(song){
  let v = voices.get(song.id);
  if (v) return v;
  const blob = await getFile(song.id);
  if (!blob) return null;
  const el = new Audio();
  el.preload = "auto";
  el.playsInline = true;
  const url = URL.createObjectURL(blob);
  el.src = url;
  v = {el, url, src: null, fade: null, norm: null};
  voices.set(song.id, v);
  return v;
}
function wire(v){
  if (v.src) return;
  ensureCtx();
  v.src = ctx.createMediaElementSource(v.el);
  v.fade = ctx.createGain(); v.norm = ctx.createGain();
  v.src.connect(v.fade); v.fade.connect(v.norm); v.norm.connect(limiter);
}
function dropVoice(id){
  const v = voices.get(id); if (!v) return;
  try{ v.el.pause(); }catch(e){}
  try{ v.src && v.src.disconnect(); v.norm && v.norm.disconnect(); }catch(e){}
  URL.revokeObjectURL(v.url);
  voices.delete(id);
}
function waitMeta(el){
  return el.readyState >= 1 ? Promise.resolve() :
    new Promise(res => { const f = () => { el.removeEventListener("loadedmetadata", f); res(); }; el.addEventListener("loadedmetadata", f); setTimeout(f, 4000); });
}
function seek(el, t){
  return new Promise(res => {
    if (Math.abs(el.currentTime - t) < 0.05){ res(); return; }
    const f = () => { el.removeEventListener("seeked", f); res(); };
    el.addEventListener("seeked", f); setTimeout(f, 1500);
    el.currentTime = t;
  });
}

let cur = null, session = 0, endTimer = null, tick = null;

async function play(song, opts = {}){
  if (!opts.force && cur && cur.song.id === song.id){ stop(); return; }
  scrubPause();
  const my = ++session;
  ensureCtx();
  const prev = cur;
  if (prev) fadeOutAndPause(prev, 0.35);
  clearTimeout(endTimer); clearInterval(tick);

  // Elemente werden beim Start vorgeladen -> hier synchron, damit iOS den Tipp als Auslöser akzeptiert
  let v = voices.get(song.id);
  if (!v){ v = await getVoice(song); if (my !== session) return; }
  if (!v){ toast("Audiodatei fehlt – bitte im Bearbeiten-Dialog neu wählen."); return; }
  wire(v);
  const g = v.fade.gain, now = ctx.currentTime;
  const fadeS = Math.max(0, Number(S.fade) || 0);
  g.cancelScheduledValues(now); g.setValueAtTime(fadeS > 0 ? 0.0001 : 1, now);
  v.norm.gain.value = S.norm && song.gain ? song.gain : 1;

  // iPhone: play() direkt im Tipp starten, dann an die Startstelle spulen (leise, darum unhörbar)
  const pp = v.el.play();
  if (pp && pp.catch) pp.catch(err => { if (my === session){ toast("Abspielen blockiert: " + err.message); setActive(null); cur = null; } });
  await waitMeta(v.el);
  if (my !== session) return;
  const start = Math.min(song.start || 0, Math.max(0, (v.el.duration || 1e9) - 1));
  await seek(v.el, start);
  if (my !== session) return;
  if (v.el.paused) await v.el.play().catch(() => {});

  const len = (v.el.duration || 0) - start;
  const dur = song.dur > 0 ? Math.min(song.dur, len) : len;
  const fs = Math.min(fadeS, dur / 2);
  const t0 = ctx.currentTime;
  g.cancelScheduledValues(t0);
  if (fs > 0){
    g.setValueAtTime(0.0001, t0);
    g.linearRampToValueAtTime(1, t0 + fs);
  } else g.setValueAtTime(1, t0);
  if (song.dur > 0 && fs > 0){
    // Ausblenden direkt im Audio-Takt planen -> klappt auch bei gesperrtem Bildschirm
    g.setValueAtTime(1, t0 + dur - fs);
    g.linearRampToValueAtTime(0.0001, t0 + dur);
  }
  cur = {song, v, start, dur};
  setActive(song, 0);
  if (song.dur > 0){
    endTimer = setTimeout(() => { if (my === session) finish(); }, dur * 1000 + 80);
    tick = setInterval(() => {   // Sicherheitsnetz, falls Timer gedrosselt wurden
      if (my !== session){ clearInterval(tick); return; }
      if (v.el.currentTime >= start + dur + 0.1) finish();
    }, 250);
  } else {
    v.el.onended = () => { if (my === session) finish(); };
  }
}
function finish(){
  if (!cur) return;
  const c = cur; cur = null; session++;
  clearTimeout(endTimer); clearInterval(tick);
  c.v.el.pause();
  setActive(null);
}
function fadeOutAndPause(c, secs){
  const g = c.v.fade.gain, t = ctx.currentTime;
  g.cancelScheduledValues(t);
  g.setValueAtTime(Math.max(0.0001, g.value), t);
  g.linearRampToValueAtTime(0.0001, t + secs);
  setTimeout(() => { if (!cur || cur.v !== c.v) c.v.el.pause(); }, secs * 1000 + 50);
}
function stop(){
  session++;
  clearTimeout(endTimer); clearInterval(tick);
  if (cur){ fadeOutAndPause(cur, Number(S.fade) > 0 ? 0.6 : 0.05); cur = null; }
  setActive(null);
}
function setActive(song, elapsed = 0){
  const id = song ? song.id : null;
  document.querySelectorAll(".tile").forEach(el => {
    const on = el.dataset.id === id;
    el.classList.toggle("playing", on);
    const bar = el.querySelector(".bar");
    bar.style.transition = "none"; bar.style.width = "0";
    if (on && cur && cur.dur > 0){
      void bar.offsetWidth;
      bar.style.transition = "width " + cur.dur + "s linear";
      bar.style.width = "100%";
    }
  });
  $("stopBtn").classList.toggle("show", !!id);
}

/* ---------- Lautstärke-Analyse (einmal beim Hinzufügen) ---------- */
async function analyze(song, blob){
  try{
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const tmp = new AC(1, 44100, 44100);
    const buf = await tmp.decodeAudioData(await blob.arrayBuffer());
    // RMS über Blöcke; laute Abschnitte (oberstes Drittel) zählen -> passt zu Refrains
    const ch = buf.getChannelData(0), block = Math.floor(buf.sampleRate * 0.4), vals = [];
    for (let i = 0; i + block < ch.length; i += block){
      let s = 0; for (let j = i; j < i + block; j += 4) s += ch[j] * ch[j];
      vals.push(Math.sqrt(s / (block / 4)));
    }
    vals.sort((a, b) => a - b);
    const top = vals.slice(Math.floor(vals.length * 0.66));
    const rms = top.reduce((a, b) => a + b, 0) / Math.max(1, top.length);
    const target = 0.25;
    song.gain = Math.round(Math.max(0.3, Math.min(1.8, target / Math.max(rms, 1e-4))) * 100) / 100;
    song.len = Math.round(buf.duration);
  }catch(e){ song.gain = 1; }
}

/* ---------- Kacheln ---------- */
function render(){
  const g = $("grid");
  if (!S.songs.length){
    g.innerHTML = '<div class="empty"><b>Noch keine Songs.</b><br>Tippe unten rechts auf <b>+</b> und wähle deine MP3s aus<br>(z. B. aus der Dateien-App).<br><br>Die Dateien bleiben nur auf diesem Handy.</div>';
    return;
  }
  g.innerHTML = S.songs.map(s => {
    const unset = !s.startSet;
    const meta = unset ? "Start setzen ✎" : fmtTime(s.start) + (s.dur > 0 ? " · " + s.dur + "s" : "");
    return `
    <div class="tile${present.has(s.id) ? "" : " missing"}" data-id="${esc(s.id)}"
         style="background:linear-gradient(145deg, ${esc(s.color)}, ${esc(s.color)}aa)">
      <div class="m${unset ? " warn" : ""}">${meta}</div>
      <button class="edit" data-edit="${esc(s.id)}" aria-label="Bearbeiten">✎</button>
      <div class="t">${esc(s.title || "Ohne Titel")}</div>
      ${s.artist ? `<div class="a">${esc(s.artist)}</div>` : ""}
      <div class="bar"></div>
    </div>`;
  }).join("");
  if (cur) setActive(cur.song);
}
$("grid").addEventListener("click", e => {
  const ed = e.target.closest("[data-edit]");
  if (ed){ e.stopPropagation(); openEdit(ed.dataset.edit); return; }
  const tile = e.target.closest(".tile");
  if (!tile) return;
  const s = S.songs.find(x => x.id === tile.dataset.id);
  if (!s) return;
  if (!present.has(s.id)){ openEdit(s.id); toast("Audiodatei fehlt – bitte neu wählen."); return; }
  play(s);
});

/* ---------- Songs hinzufügen ---------- */
$("addBtn").onclick = () => { ensureCtx(); $("filePick").click(); };
$("filePick").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length) return;
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(err){}
  let n = 0;
  for (const f of files){
    const id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const nm = nameFromFile(f.name);
    const song = {id, title: nm.title, artist: nm.artist, start: 0, dur: 30, startSet: false,
                  color: COLORS[S.songs.length % COLORS.length], gain: 1};
    toast("Speichere " + (++n) + "/" + files.length + ": " + (nm.title || f.name), 60000);
    try{
      await putFile(id, f);
      await analyze(song, f);
      S.songs.push(song); present.add(id); saveSongs(); render();
      getVoice(song).catch(() => {});
    }catch(err){ toast("Konnte „" + f.name + "“ nicht speichern: " + err.message, 6000); await sleep(1500); }
  }
  toast(n + " Song" + (n === 1 ? "" : "s") + " hinzugefügt ✓ – jetzt bei jedem den Refrain-Start setzen (✎).", 5000);
};

/* ---------- Bearbeiten ---------- */
let editId = null, editColor = COLORS[0], scrub = null;
const scrubPause = () => { if (scrub && !scrub.paused) scrub.pause(); updScrubBtn(); };
function updScrubBtn(){ $("sPlay").textContent = scrub && !scrub.paused ? "⏸" : "▶"; }
function drawSwatches(){
  $("swatches").innerHTML = COLORS.map(c =>
    `<div class="sw${c === editColor ? " sel" : ""}" data-c="${c}" style="background:${c}"></div>`).join("");
}
$("swatches").addEventListener("click", e => {
  const sw = e.target.closest(".sw"); if (!sw) return;
  editColor = sw.dataset.c; drawSwatches();
});
async function loadScrub(id){
  if (scrub){ scrub.pause(); URL.revokeObjectURL(scrub.src); }
  scrub = new Audio(); scrub.playsInline = true; scrub.preload = "auto";
  const blob = await getFile(id).catch(() => null);
  if (!blob){ $("sLen").textContent = "/ Datei fehlt"; return; }
  scrub.src = URL.createObjectURL(blob);
  scrub.addEventListener("loadedmetadata", () => {
    $("sBar").max = scrub.duration || 0;
    $("sLen").textContent = "/ " + fmtTime(scrub.duration);
    scrub.currentTime = parseTime($("fStart").value);
  });
  scrub.addEventListener("timeupdate", () => {
    $("sPos").innerHTML = "<b>" + fmtTime(scrub.currentTime) + "</b>";
    if (!dragging) $("sBar").value = scrub.currentTime;
  });
  scrub.addEventListener("pause", updScrubBtn);
  scrub.addEventListener("play", updScrubBtn);
}
let dragging = false;
$("sBar").addEventListener("input", () => { dragging = true; $("sPos").innerHTML = "<b>" + fmtTime($("sBar").value) + "</b>"; });
$("sBar").addEventListener("change", () => { dragging = false; if (scrub) scrub.currentTime = parseFloat($("sBar").value); });
$("sPlay").onclick = () => {
  if (!scrub) return;
  if (scrub.paused){ if (cur) stop(); scrub.play().catch(err => toast(err.message)); } else scrub.pause();
};
$("sBack").onclick = () => { if (scrub) scrub.currentTime = Math.max(0, scrub.currentTime - 5); };
$("sFwd").onclick = () => { if (scrub) scrub.currentTime = Math.min(scrub.duration || 0, scrub.currentTime + 5); };
$("sSet").onclick = () => {
  if (!scrub) return;
  $("fStart").value = fmtTime(Math.round(scrub.currentTime * 10) / 10);
  toast("Start: " + $("fStart").value);
};

function openEdit(id){
  const s = S.songs.find(x => x.id === id); if (!s) return;
  editId = id;
  $("fTitle").value = s.title || "";
  $("fArtist").value = s.artist || "";
  $("fStart").value = fmtTime(s.start);
  $("fDur").value = s.dur;
  editColor = s.color; drawSwatches();
  $("sPos").innerHTML = "<b>" + fmtTime(s.start) + "</b>"; $("sLen").textContent = "/ …";
  updScrubBtn();
  loadScrub(id);
  $("editDlg").showModal();
}
function formValues(){
  return {
    title: $("fTitle").value.trim(),
    artist: $("fArtist").value.trim(),
    start: parseTime($("fStart").value),
    dur: Math.max(0, parseInt($("fDur").value, 10) || 0),
    color: editColor
  };
}
$("editDlg").addEventListener("close", () => { if (scrub){ scrub.pause(); } });
$("saveBtn").onclick = () => {
  const s = S.songs.find(x => x.id === editId); if (!s) return;
  Object.assign(s, formValues(), {startSet: true});
  saveSongs(); render(); $("editDlg").close();
};
$("previewBtn").onclick = () => {
  const s = S.songs.find(x => x.id === editId); if (!s) return;
  scrubPause();
  play(Object.assign({}, s, formValues()), {force: true});
};
$("delBtn").onclick = async () => {
  if (!confirm("Song wirklich löschen?")) return;
  if (cur && cur.song.id === editId) stop();
  dropVoice(editId);
  await delFile(editId).catch(() => {});
  present.delete(editId);
  S.songs = S.songs.filter(x => x.id !== editId);
  saveSongs(); render(); $("editDlg").close();
};
$("replaceBtn").onclick = () => $("fileReplace").click();
$("fileReplace").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  const s = S.songs.find(x => x.id === editId); if (!f || !s) return;
  try{
    if (cur && cur.song.id === s.id) stop();
    dropVoice(s.id);
    await putFile(s.id, f); present.add(s.id);
    await analyze(s, f); saveSongs(); render();
    getVoice(s).catch(() => {});
    loadScrub(s.id);
    toast("Datei ersetzt ✓");
  }catch(err){ toast("Fehler: " + err.message); }
};

/* ---------- Einstellungen ---------- */
async function showStorage(){
  try{
    const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
    $("sStore").textContent = S.songs.length + " Songs gespeichert" +
      (est ? " · belegt ca. " + Math.round(est.usage / 1048576) + " MB" : "");
  }catch(e){ $("sStore").textContent = ""; }
}
$("settingsBtn").onclick = () => {
  $("sFade").value = S.fade; $("sNorm").checked = !!S.norm;
  showStorage(); $("setDlg").showModal();
};
$("sFade").addEventListener("input", () => {
  const v = parseFloat(String($("sFade").value).replace(",", "."));
  S.fade = isFinite(v) ? Math.max(0, Math.min(15, v)) : 0; LS.set("rp2_fade", S.fade);
});
$("sNorm").addEventListener("change", () => { S.norm = $("sNorm").checked; LS.set("rp2_norm", S.norm); });
$("setClose").onclick = () => $("setDlg").close();
$("wipeBtn").onclick = async () => {
  if (!confirm("Wirklich alle Songs und Dateien löschen?")) return;
  stop();
  for (const s of S.songs){ dropVoice(s.id); await delFile(s.id).catch(() => {}); }
  S.songs = []; present = new Set(); saveSongs(); render(); showStorage();
};
$("stopBtn").onclick = stop;


/* ---------- Start ---------- */
(async () => {
  try{ present = new Set(await allKeys()); }catch(e){ present = new Set(); }
  render();
  for (const s of S.songs) if (present.has(s.id)) await getVoice(s).catch(() => {});
})();
})();
</script>
</body>
</html>
